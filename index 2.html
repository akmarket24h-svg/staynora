</style>
<script id="v532-fix-script">
(function(){
  window.v532ISO=function(d){return d.toISOString().slice(0,10)};
  window.v532Today=function(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
  window.v532Add=function(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
  window.cal531Start=window.cal531Start||'2026-10-01';
  window.cal531Today=function(){cal531Start=v532Today();go('calendar')};

  // Fully self-contained calendar renderer for Safari/iOS.
  window.cal531Calendar=function(){
    try{
      let days=cal531Days(), units=(typeof filteredUnits52==='function'?filteredUnits52():db.units);
      let rs=(typeof filteredReservations52==='function'?filteredReservations52():db.reservations).filter(r=>!['CANCELLED','NO_SHOW'].includes(r.status));
      let first=days[0], last=days[days.length-1], now=v532Today();
      let month=cal531Date(first).toLocaleDateString(undefined,{month:'long',year:'numeric'});
      let leftRows=units.map(u=>`<div class='cal531-unit'><div class='cal531-eye'>◉</div><div><div class='cal531-unitname'>${u.name}</div><div class='cal531-meta'>${(typeof roomType52==='function'&&roomType52(u.roomTypeId)?.capacity)||u.guests||2} guests · ${(u.status||'READY').replaceAll('_',' ')}</div></div></div>`).join('');
      let heads=days.map(d=>{let x=cal531Date(d),wk=[0,6].includes(x.getDay()),td=d===now;return `<div class='cal531-day ${wk?'weekend':''} ${td?'today':''}'><span>${x.toLocaleDateString(undefined,{weekday:'short'})}</span><b>${x.getDate()}</b></div>`}).join('');
      let rows=units.map(u=>{
        let cells=days.map(d=>{let x=cal531Date(d),wk=[0,6].includes(x.getDay()),td=d===now,ooo=u.status==='OUT_OF_ORDER';return `<div class='cal531-cell ${wk?'weekend':''} ${td?'today':''} ${ooo?'ooo':''}' onclick="cal531New('${u.id}','${d}')"></div>`}).join('');
        let bars=rs.filter(r=>r.unitId===u.id && overlap(r.checkIn,r.checkOut,first,v532Add(last,1))).map(r=>{
          let start=Math.max(0,Math.round((cal531Date(r.checkIn)-cal531Date(first))/86400000));
          let end=Math.min(14,Math.round((cal531Date(r.checkOut)-cal531Date(first))/86400000));
          let width=Math.max(1,end-start), cell=window.innerWidth<=650?48:55, g=guest(r.guestId);
          return `<div class='cal531-booking ${cal531SourceClass(r.source)}' style='left:${start*cell+3}px;width:${Math.max(42,width*cell-6)}px' onclick="event.stopPropagation();cal531Open('${r.id}')"><div class='guest'>${g?.name||'Guest'}</div><div class='sub'>${cal531SourceLabel(r.source)} · ${(r.adults||0)+(r.children||0)} guests</div></div>`
        }).join('');
        return `<div class='cal531-row'>${cells}${bars}</div>`
      }).join('');
      return page('Calendar','Live inventory timeline')+`<div class='cal531-wrap'>
       <div class='cal531-toolbar'><div class='cal531-tools'><button class='cal531-icon' onclick='cal531Shift(-7)'>‹</button><button class='cal531-today' onclick='cal531Today()'>Today</button><button class='cal531-icon' onclick='cal531Shift(7)'>›</button></div><div class='cal531-month'>${month}</div></div>
       <div class='cal531-body'><div class='cal531-left'><div class='cal531-left-head'>ROOMS</div>${leftRows}</div><div class='cal531-right'><div class='cal531-timeline'><div class='cal531-days'>${heads}</div><div class='cal531-grid'>${rows}</div></div></div></div>
       <div class='cal531-legend'><span><i class='cal531-dot' style='background:#176b3a'></i>Direct</span><span><i class='cal531-dot' style='background:#0877c9'></i>Booking.com</span><span><i class='cal531-dot' style='background:#e05260'></i>Airbnb</span><span>▧ Out of order</span></div></div>
       <button class='cal531-add' onclick='newReservation()'>＋</button>`;
    }catch(e){
      return page('Calendar','Live inventory timeline')+`<div class='card'><h3>Calendar recovery</h3><p>The calendar encountered an error.</p><pre style='white-space:pre-wrap;font-size:11px'>${String(e.message||e)}</pre><button class='btn primary' onclick="location.reload()">Reload</button></div>`;
    }
  };
  pages.calendar=cal531Calendar;

  // Make bottom Calendar action deterministic even if an older handler was cached.
  document.querySelectorAll('.mobilebar button,.mobilebar a').forEach(el=>{
    if((el.textContent||'').trim().toLowerCase().includes('calendar')){
      el.onclick=function(ev){ev.preventDefault();ev.stopPropagation();go('calendar');return false}
    }
  });
  if(!db.settings.v532Migrated){db.settings.v532Migrated=true;save();audit('MOBILE_CALENDAR_FIXED','Staynora v5.3.2')};
})();
</script>


<script id="v533-calendar-stability">
(function(){
  window.staynoraRangesOverlap = function(aStart,aEnd,bStart,bEnd){
    if(!aStart || !aEnd || !bStart || !bEnd) return false;
    return String(aStart) < String(bEnd) && String(aEnd) > String(bStart);
  };

  if(typeof window.cal531Calendar === 'function'){
    const oldCalendar = window.cal531Calendar;
    window.cal531Calendar = function(){
      try{
        // v5.3.2 referenced a non-existent global overlap().
        // Expose a compatibility alias only during calendar rendering.
        const hadOverlap = typeof window.overlap === 'function';
        const previousOverlap = window.overlap;
        window.overlap = window.staynoraRangesOverlap;
        const out = oldCalendar();
        if(hadOverlap) window.overlap = previousOverlap;
        else try{ delete window.overlap; }catch(_){ window.overlap = undefined; }
        return out;
      }catch(e){
        return page('Calendar','Live inventory timeline')+
          `<div class="card"><h3>Calendar recovery</h3>
          <p>${String(e.message||e)}</p>
          <button class="btn primary" onclick="go('calendar')">Try again</button></div>`;
      }
    };
    pages.calendar = window.cal531Calendar;
  }

  // Ensure Calendar bottom navigation always invokes the current renderer.
  setTimeout(function(){
    document.querySelectorAll('.mobilebar button,.mobilebar a').forEach(function(el){
      if((el.textContent||'').toLowerCase().includes('calendar')){
        el.onclick=function(e){
          if(e){e.preventDefault();e.stopPropagation();}
          go('calendar');
          return false;
        };
      }
    });
  },0);

  try{
    db.settings.v533Migrated=true;
    save();
  }catch(_){}
})();
</script>
