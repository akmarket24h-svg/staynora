<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><title>Staynora PMS v6.2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
button,input,select{font:inherit}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#0f172a;color:white;padding:18px 12px;height:100vh;position:sticky;top:0;overflow:auto}
.brand{font-size:22px;font-weight:850;padding:8px 10px}.brand small{display:block;color:#94a3b8;font-size:11px;font-weight:500}.navhead{font-size:10px;color:#64748b;text-transform:uppercase;padding:16px 10px 5px}
.nav button{width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:9px 10px;border-radius:8px}.nav button.active,.nav button:hover{background:#1e293b;color:white}
.main{min-width:0}.top{height:62px;background:#fff;border-bottom:1px solid #e6eaf0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.content{padding:22px;max-width:1600px}.title h1{margin:0;font-size:25px}.muted{color:#64748b;font-size:12px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:15px;box-shadow:0 2px 8px #0f172a08}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.kpi{font-size:26px;font-weight:850;margin-top:5px}
.toolbar,.calnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.calnav{justify-content:space-between}.btn{border:1px solid #d8dee8;background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer;font-weight:650}.btn.primary{background:#111827;color:#fff;border-color:#111827}.btn.danger{color:#b42318}
.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px}.table th{background:#fafbfc}
.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef2ff;font-size:10px;font-weight:800}.ok{background:#eaf8ef;color:#147a3e}.warn{background:#fff6df;color:#956500}.bad{background:#fff0f0;color:#a51d2d}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form label{font-size:12px;color:#475569}.form input,.form select{width:100%;padding:9px;margin-top:4px;border:1px solid #d8dee8;border-radius:8px;background:#fff}.full{grid-column:1/-1}
.modal{position:fixed;inset:0;background:#0007;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.modalbox{background:#fff;border-radius:15px;padding:18px;width:min(650px,100%);max-height:90vh;overflow:auto}.hide{display:none!important}
.mobilebar{display:none}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px;font-size:12px}.property-select{max-width:240px;padding:8px 10px;border:1px solid #d8dee8;border-radius:9px;background:#fff;font-weight:650}
.calwrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid #e5e9f0;border-radius:14px;background:white;position:relative}.calgrid{--unit:170px;--day:105px;display:grid;grid-template-columns:var(--unit) repeat(14,var(--day));grid-auto-rows:64px;min-width:1640px;position:relative}
.calcell{border-right:1px solid #edf0f4;border-bottom:1px solid #edf0f4;padding:8px;background:white;font-size:11px;position:relative}.calhead{height:64px;position:sticky;top:0;z-index:6;background:#f8fafc;text-align:center}.calunit{position:sticky;left:0;z-index:5;background:#fff;box-shadow:2px 0 4px #0f172a0b}.corner{z-index:10;background:#f8fafc}
.today{background:#eff6ff}.weekend{background:#fafafa}.daynum{font-size:17px;font-weight:850}.dow{font-size:10px;color:#64748b;text-transform:uppercase}.unitname{font-weight:800;font-size:12px}.unitcode{color:#64748b;font-size:10px}
.bookingbar{position:absolute;top:11px;height:42px;border-radius:8px;padding:6px 9px;z-index:4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px;font-weight:750;box-shadow:0 1px 3px #0002;cursor:pointer;border-left:4px solid #2563eb}
.bookingbar.direct{background:#dbeafe;border-left-color:#2563eb}.bookingbar.bookingcom{background:#e0e7ff;border-left-color:#4f46e5}.bookingbar.airbnb{background:#ffe4e6;border-left-color:#e11d48}.bookingbar.checked{box-shadow:inset 0 0 0 2px #16a34a}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#64748b}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}.d1{background:#2563eb}.d2{background:#4f46e5}.d3{background:#e11d48}
.emptycell{cursor:pointer}.emptycell:hover{background:#f8fafc}
@media(max-width:900px){.app{display:block}.side{display:none}.top{padding:8px 12px;height:auto;min-height:62px}.content{padding:14px 10px 92px}.grid{grid-template-columns:repeat(2,1fr)}.mobilebar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe4ea;z-index:50;padding-bottom:max(env(safe-area-inset-bottom),6px)}.mobilebar button{border:0;background:white;padding:8px 2px;font-size:10px}.mobilebar b{display:block;font-size:18px}.calgrid{--unit:122px;--day:86px;min-width:1326px}.calunit{padding:7px}.calnav{gap:6px}.calnav .range{order:-1;width:100%;text-align:center}.property-select{max-width:165px}.form{grid-template-columns:1fr}.title h1{font-size:26px}}
 
@media(max-width:900px){
 .calgrid{--unit:106px;--day:58px;min-width:918px;grid-auto-rows:58px}
 .calhead{height:58px}.calcell{padding:5px}.calunit{padding:6px}
 .unitname{font-size:10px;line-height:1.15}.unitcode{font-size:9px}
 .daynum{font-size:15px}.dow{font-size:9px}.bookingbar{height:36px;padding:5px 6px;font-size:9px}
 .calnav{gap:5px;margin:8px 0}.calnav .range{font-size:13px}
}

.procal-shell{background:#fff;border:1px solid #d9dee7;border-radius:16px;overflow:hidden}.procal-top{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border-bottom:1px solid #e5e7eb}.procal-month{font-weight:850}.procal-actions{display:flex;gap:5px}.procal-actions button{height:34px;border:1px solid #d9dee7;background:#fff;border-radius:9px}.procal-wrap{overflow:auto;-webkit-overflow-scrolling:touch}.procal{--u:190px;--d:92px;--r:70px;display:grid;grid-template-columns:var(--u) repeat(14,var(--d));grid-template-rows:62px;grid-auto-rows:var(--r);min-width:1478px;position:relative}.procal-corner,.procal-day,.procal-unit,.procal-cell{border-right:1px solid #e1e5eb;border-bottom:1px solid #e1e5eb}.procal-corner{position:sticky;left:0;top:0;z-index:15;background:#f8fafc;padding:10px;font-weight:850}.procal-corner small{display:block;color:#7b8798}.procal-day{position:sticky;top:0;z-index:11;background:#f8fafc;text-align:center;padding:5px 1px}.procal-day .wd{font-size:10px;color:#738095}.procal-day .dn{font-size:21px;font-weight:900}.procal-day .mo{font-size:9px;color:#8b96a7}.procal-day.today,.procal-cell.today{background:#fff2b5}.procal-unit{position:sticky;left:0;z-index:8;background:#fff;padding:8px 9px}.procal-unit .un{font-weight:850;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.procal-unit .uc,.procal-unit .cap{font-size:9px;color:#718096}.procal-cell{background:#fff}.procal-cell.today{background:#fff9dc}.procal-book{position:absolute;height:50px;border-radius:10px;padding:6px 7px;z-index:9;overflow:hidden;box-shadow:0 2px 5px #0002;border-left:5px solid;font-size:10px}.procal-book.direct{background:#dbeafe;border-color:#2563eb}.procal-book.bookingcom{background:#dff5cf;border-color:#369b30}.procal-book.airbnb{background:#ffe0e6;border-color:#e11d48}.procal-book.checked{outline:3px solid #25a55b;outline-offset:-3px}.procal-book .bn{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.procal-book .bm{font-size:9px;white-space:nowrap}.procal-fab{position:fixed;right:18px;bottom:92px;width:58px;height:58px;border:0;border-radius:16px;background:#176238;color:#fff;font-size:30px;z-index:45}.procal-legend{padding:7px 10px;font-size:10px;color:#667085}.procal-legend span{margin-right:12px}.procal-dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
@media(max-width:900px){.calendar-page .title{display:none}.procal{--u:176px;--d:67px;--r:68px;min-width:1114px;grid-template-rows:56px}.procal-day .dn{font-size:18px}.procal-unit .un{font-size:13px}.procal-book{height:48px}.procal-month{font-size:14px}}
</style><meta name="theme-color" content="#0b1f33">
<meta name="apple-mobile-web-app-capable" content="yes">

<body><div class="app"><aside class="side"><div class="brand">Staynora<small>Property Management, Simplified.</small></div><div id="nav" class="nav"></div></aside>
<main class="main"><header class="top"><div><select class="property-select" id="propertySel" onchange="setProperty(this.value)"></select><div class="muted">Staynora PMS v6.2 · Pro Calendar</div></div><button class="btn" onclick="resetDemo()">Reset demo</button></header><section id="content" class="content"></section></main></div>
<div class="mobilebar"><button onclick="go('dashboard')"><b>▦</b>Home</button><button onclick="go('calendar')"><b>▣</b>Calendar</button><button onclick="go('reservations')"><b>▤</b>Bookings</button><button onclick="go('housekeeping')"><b>✓</b>Clean</button><button onclick="go('more')"><b>•••</b>More</button></div>
<div id="modal" class="modal hide"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY='staynora_v5_db',AUD='staynora_v5_audit';
const seed={properties:[{id:'p1',name:'Prague Central Residence',city:'Prague',country:'CZ'},{id:'p2',name:'Karlovy Vary Villa',city:'Karlovy Vary',country:'CZ'}],units:[{id:'u1',propertyId:'p1',name:'Apartment 101',code:'APT-101',guests:4,status:'READY'},{id:'u2',propertyId:'p1',name:'Apartment 102',code:'APT-102',guests:4,status:'READY'},{id:'u3',propertyId:'p1',name:'Apartment 201',code:'APT-201',guests:6,status:'DIRTY'},{id:'u4',propertyId:'p2',name:'Villa Garden',code:'KV-01',guests:8,status:'READY'}],guests:[{id:'g1',name:'John Smith',email:'john@example.com',phone:'+44 7000 000001',country:'GB'},{id:'g2',name:'Anna Müller',email:'anna@example.com',phone:'+49 170 000002',country:'DE'},{id:'g3',name:'Marco Rossi',email:'marco@example.com',phone:'+39 333 000003',country:'IT'}],reservations:[{id:'r1',code:'STN-260001',guestId:'g1',unitId:'u1',checkIn:'2026-10-03',checkOut:'2026-10-06',adults:2,status:'CONFIRMED',source:'DIRECT',total:190},{id:'r2',code:'STN-260002',guestId:'g2',unitId:'u2',checkIn:'2026-10-04',checkOut:'2026-10-08',adults:2,status:'CHECKED_IN',source:'BOOKING_COM',total:260},{id:'r3',code:'STN-260003',guestId:'g3',unitId:'u4',checkIn:'2026-10-10',checkOut:'2026-10-13',adults:4,status:'CONFIRMED',source:'AIRBNB',total:330}],invoices:[{id:'i1',number:'INV-260001',reservationId:'r1',total:190,status:'ISSUED'},{id:'i2',number:'INV-260002',reservationId:'r2',total:260,status:'ISSUED'}],payments:[{id:'pay1',invoiceId:'i1',amount:190,status:'SUCCEEDED',method:'BANK_TRANSFER'}],refunds:[],tasks:[{id:'t1',unitId:'u3',type:'CHECKOUT_CLEANING',status:'PENDING',date:'2026-10-02',assigned:'Housekeeping'}],maintenance:[{id:'m1',unitId:'u3',issue:'Check bathroom light',status:'OPEN',priority:'LOW'}],rates:{},settings:{currency:'EUR',defaultRate:55,cleaningFee:25,weekendUplift:12,otaCommission:15,selectedProperty:'ALL'}};
const $=id=>document.getElementById(id);
let db=load(),calOffset=0,currentPage='dashboard';
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));return d||structuredClone(seed)}catch(e){return JSON.parse(JSON.stringify(seed))}}
function ensure(){for(const k of ['properties','units','guests','reservations','invoices','payments','tasks','maintenance'])db[k]=db[k]||[];db.refunds=db.refunds||[];db.rates=db.rates||{};db.guestRegister=db.guestRegister||[];db.touristTax=db.touristTax||[];db.settings=db.settings||{};db.settings.selectedProperty=db.settings.selectedProperty||'ALL';save()}ensure();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(){return Math.random().toString(36).slice(2,10)}
function audit(a,d){let x=[];try{x=JSON.parse(localStorage.getItem(AUD)||'[]')}catch(e){}x.unshift({time:new Date().toISOString(),action:a,detail:d});localStorage.setItem(AUD,JSON.stringify(x.slice(0,200)))}
function ymd(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function money(n){return '€'+Number(n||0).toFixed(2)}function unit(id){return db.units.find(x=>x.id===id)}function guest(id){return db.guests.find(x=>x.id===id)}function prop(id){return db.properties.find(x=>x.id===id)}
function nights(a,b){return Math.max(0,Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000))}
function status(s){let c=['CONFIRMED','READY','SUCCEEDED','COMPLETED','PAID'].includes(s)?'ok':['CANCELLED','OUT_OF_ORDER'].includes(s)?'bad':'warn';return `<span class="pill ${c}">${s}</span>`}
function page(t,s=''){return `<div class="title"><h1>${t}</h1><div class="muted">${s}</div></div>`}
function modal(h){$('modalbox').innerHTML=h;$('modal').classList.remove('hide')}function closeModal(){$('modal').classList.add('hide')}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function filteredUnits(){return db.settings.selectedProperty==='ALL'?db.units:db.units.filter(u=>u.propertyId===db.settings.selectedProperty)}
function filteredReservations(){let s=new Set(filteredUnits().map(u=>u.id));return db.reservations.filter(r=>s.has(r.unitId))}
function setProperty(v){db.settings.selectedProperty=v;save();go(currentPage)}
function initProperty(){$('propertySel').innerHTML=`<option value="ALL">All properties</option>`+db.properties.map(p=>`<option value="${p.id}" ${db.settings.selectedProperty===p.id?'selected':''}>${p.name}</option>`).join('')}
function conflict(uid,ci,co,ignore){return db.reservations.some(r=>r.id!==ignore&&r.unitId===uid&&!['CANCELLED','NO_SHOW'].includes(r.status)&&ci<r.checkOut&&co>r.checkIn)}
function rateFor(uid,date){if(db.rates[uid+'|'+date]!=null)return +db.rates[uid+'|'+date];let v=+db.settings.defaultRate||55,d=new Date(date+'T00:00:00');if([5,6].includes(d.getDay()))v*=1+(+db.settings.weekendUplift||0)/100;return v}
function quote(uid,ci,co){let n=nights(ci,co),room=0;for(let i=0;i<n;i++){let d=new Date(ci+'T00:00:00');d.setDate(d.getDate()+i);room+=rateFor(uid,ymd(d))}return{n,room,clean:+db.settings.cleaningFee||0,total:room+(+db.settings.cleaningFee||0)}}
const navGroups=[['Overview',[['dashboard','▦ Dashboard']]],['Operations',[['calendar','▣ Calendar'],['reservations','▤ Reservations'],['guests','♙ Guests'],['housekeeping','✓ Housekeeping'],['maintenance','⚒ Maintenance']]],['Inventory & Revenue',[['properties','⌂ Properties & Units'],['availability','◫ Availability'],['rates','€ Rates & Restrictions'],['booking','↗ Booking Engine']]],['Finance',[['folio','▧ Folio'],['payments','◈ Payments & Refunds'],['finance','€ Finance']]],['Distribution',[['channels','↔ Channel Sync'],['portal','♙ Guest Portal']]],['Compliance',[['compliance','CZ Guest Register & Tax']]],['Analytics & System',[['reports','▥ Reports'],['audit','⌕ Audit Log'],['settings','⚙ Settings']]]];
function renderNav(){$('nav').innerHTML=navGroups.map(g=>`<div class="navhead">${g[0]}</div>`+g[1].map(x=>`<button data-p="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')).join('')}
function go(p){currentPage=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));$('content').innerHTML=(pages[p]||pages.more)();window.scrollTo(0,0)}
function revenue(){return filteredReservations().filter(r=>r.status!=='CANCELLED').reduce((s,r)=>s+(+r.total||0),0)}
function occupancy(){return Math.min(100,Math.round(filteredReservations().filter(r=>!['CANCELLED','NO_SHOW'].includes(r.status)).length/Math.max(1,filteredUnits().length*3)*100))}
function resTable(rs){return `<div style="overflow:auto"><table class="table"><tr><th>Code</th><th>Guest</th><th>Unit</th><th>Dates</th><th>Source</th><th>Total</th><th>Status</th><th></th></tr>${rs.map(r=>`<tr><td>${r.code}</td><td>${guest(r.guestId)?.name||'Guest'}</td><td>${unit(r.unitId)?.name||''}</td><td>${r.checkIn} → ${r.checkOut}</td><td>${r.source}</td><td>${money(r.total)}</td><td>${status(r.status)}</td><td><button class="btn" onclick="editReservation('${r.id}')">Open</button></td></tr>`).join('')}</table></div>`}
function calendar(){
let today=new Date();today.setHours(0,0,0,0);let start=new Date(today);start.setDate(start.getDate()+calOffset);
let dates=Array.from({length:14},(_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);return d}),ds=dates.map(ymd),todayS=ymd(today),us=filteredUnits(),mobile=innerWidth<=900;
let dw=mobile?67:92,uw=mobile?176:190,rh=mobile?68:70,hh=mobile?56:62,cells='',bars='';
us.forEach((u,row)=>{cells+=`<div class="procal-unit"><div class="un">${u.name}</div><div class="uc">${u.code||''}</div><div class="cap">👤 ${u.guests||2} · ${u.status||'READY'}</div></div>`;
ds.forEach(d=>cells+=`<div class="procal-cell ${d===todayS?'today':''}" onclick="quickBooking('${u.id}','${d}')"></div>`);
db.reservations.filter(r=>r.unitId===u.id&&!['CANCELLED','NO_SHOW'].includes(r.status)).forEach(r=>{let a=Math.floor((new Date(r.checkIn+'T00:00:00')-new Date(ds[0]+'T00:00:00'))/864e5),b=Math.ceil((new Date(r.checkOut+'T00:00:00')-new Date(ds[0]+'T00:00:00'))/864e5);if(b<=0||a>=14)return;a=Math.max(0,a);b=Math.min(14,b);let span=Math.max(1,b-a),cls=(r.source||'DIRECT').toLowerCase().replace('_',''),g=guest(r.guestId),n=Math.max(1,Math.round((new Date(r.checkOut+'T00:00:00')-new Date(r.checkIn+'T00:00:00'))/864e5)),src=r.source==='BOOKING_COM'?'B.com':r.source==='AIRBNB'?'Airbnb':'Direct';bars+=`<div class="procal-book ${cls} ${r.status==='CHECKED_IN'?'checked':''}" style="left:${uw+a*dw+3}px;top:${hh+row*rh+9}px;width:${Math.max(28,span*dw-6)}px" onclick="event.stopPropagation();editReservation('${r.id}')"><div class="bn">${g?.name||'Guest'}</div><div class="bm">${src} · 👤${r.adults||1} · ${n}n</div></div>`})});
let heads=`<div class="procal-corner">ROOMS<small>${us.length} units</small></div>`+dates.map(d=>{let x=ymd(d);return `<div class="procal-day ${x===todayS?'today':''}"><div class="wd">${d.toLocaleDateString(undefined,{weekday:'short'})}</div><div class="dn">${d.getDate()}</div><div class="mo">${d.toLocaleDateString(undefined,{month:'short'})}</div></div>`}).join('');
return `<div class="calendar-page"><div class="procal-shell"><div class="procal-top"><div class="procal-month">${start.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><div class="procal-actions"><button onclick="calOffset-=7;go('calendar')">‹</button><button onclick="calOffset=0;go('calendar')" style="padding:0 9px;font-weight:800">Today</button><button onclick="calOffset+=7;go('calendar')">›</button></div></div><div class="procal-wrap"><div class="procal">${heads}${cells}${bars}</div></div><div class="procal-legend"><span><i class="procal-dot" style="background:#2563eb"></i>Direct</span><span><i class="procal-dot" style="background:#43a536"></i>Booking.com</span><span><i class="procal-dot" style="background:#e11d48"></i>Airbnb</span></div></div><button class="procal-fab" onclick="newReservation()">＋</button></div>`}
function quickBooking(uid,date){let d=new Date(date+'T00:00:00');d.setDate(d.getDate()+1);newReservation(uid,date,ymd(d))}
function guestOpts(){return db.guests.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}function unitOpts(sel=''){return filteredUnits().map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${u.name}</option>`).join('')}
function newReservation(uid='',ci='',co=''){let a=ci||ymd(new Date());let d=new Date(a+'T00:00:00');d.setDate(d.getDate()+2);let b=co||ymd(d);modal(`<h2>New reservation</h2><div class="form"><label>Guest<select id="ng">${guestOpts()}</select></label><label>Unit<select id="nu">${unitOpts(uid)}</select></label><label>Check-in<input id="nci" type="date" value="${a}"></label><label>Check-out<input id="nco" type="date" value="${b}"></label><label>Adults<input id="na" type="number" min="1" value="2"></label><label>Source<select id="ns"><option value="DIRECT">Direct</option><option value="BOOKING_COM">Booking.com</option><option value="AIRBNB">Airbnb</option></select></label><div class="full"><button class="btn primary" onclick="createReservation()">Create</button> <button class="btn" onclick="closeModal()">Cancel</button></div></div>`)}
function createReservation(){let u=$('nu').value,ci=$('nci').value,co=$('nco').value;if(!u||co<=ci||conflict(u,ci,co)){alert('Unit unavailable or dates invalid.');return}let q=quote(u,ci,co),r={id:uid(),code:'STN-'+String(Date.now()).slice(-6),guestId:$('ng').value,unitId:u,checkIn:ci,checkOut:co,adults:+$('na').value,status:'CONFIRMED',source:$('ns').value,total:+q.total.toFixed(2)};db.reservations.push(r);db.invoices.push({id:uid(),number:'INV-'+String(Date.now()).slice(-6),reservationId:r.id,total:r.total,status:'DRAFT'});save();audit('RESERVATION_CREATED',r.code);closeModal();go('calendar')}
function editReservation(id){let r=db.reservations.find(x=>x.id===id);modal(`<h2>${r.code}</h2><div class="form"><label>Guest<input value="${guest(r.guestId)?.name||'Guest'}" disabled></label><label>Unit<select id="eu">${unitOpts(r.unitId)}</select></label><label>Check-in<input id="eci" type="date" value="${r.checkIn}"></label><label>Check-out<input id="eco" type="date" value="${r.checkOut}"></label><label>Adults<input id="ead" type="number" value="${r.adults||1}"></label><label>Status<select id="est"><option ${r.status==='CONFIRMED'?'selected':''}>CONFIRMED</option><option ${r.status==='CHECKED_IN'?'selected':''}>CHECKED_IN</option><option ${r.status==='CHECKED_OUT'?'selected':''}>CHECKED_OUT</option><option ${r.status==='CANCELLED'?'selected':''}>CANCELLED</option></select></label></div><div class="grid"><div class="card"><div class="muted">Total</div><div class="kpi">${money(r.total)}</div></div><div class="card"><div class="muted">Source</div><b>${r.source}</b></div></div><div class="toolbar"><button class="btn primary" onclick="saveReservation('${id}')">Save</button>${r.status==='CONFIRMED'?`<button class="btn" onclick="setStatus('${id}','CHECKED_IN')">Check in</button>`:''}${r.status==='CHECKED_IN'?`<button class="btn" onclick="checkout('${id}')">Check out</button>`:''}<button class="btn danger" onclick="setStatus('${id}','CANCELLED')">Cancel</button><button class="btn" onclick="closeModal()">Close</button></div>`)}
function saveReservation(id){let r=db.reservations.find(x=>x.id===id),u=$('eu').value,ci=$('eci').value,co=$('eco').value;if(co<=ci||conflict(u,ci,co,id)){alert('Unit unavailable or dates invalid.');return}let q=quote(u,ci,co);Object.assign(r,{unitId:u,checkIn:ci,checkOut:co,adults:+$('ead').value,status:$('est').value,total:+q.total.toFixed(2)});let inv=db.invoices.find(i=>i.reservationId===id);if(inv)inv.total=r.total;save();audit('RESERVATION_UPDATED',r.code);closeModal();go('calendar')}
function setStatus(id,s){let r=db.reservations.find(x=>x.id===id);r.status=s;save();audit('RESERVATION_'+s,r.code);closeModal();go('calendar')}
function checkout(id){let r=db.reservations.find(x=>x.id===id);r.status='CHECKED_OUT';db.tasks.push({id:uid(),unitId:r.unitId,type:'CHECKOUT_CLEANING',status:'PENDING',date:r.checkOut,assigned:'Housekeeping'});unit(r.unitId).status='DIRTY';save();audit('CHECKOUT',r.code);closeModal();go('housekeeping')}

function exportBackup(){
  const blob=new Blob([JSON.stringify({version:'6.2',exportedAt:new Date().toISOString(),db},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='staynora-backup-'+ymd(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
  audit('BACKUP_EXPORT','Database backup exported');
}
function importBackup(input){
 const f=input.files&&input.files[0];if(!f)return;
 const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);const n=x.db||x;if(!n.properties||!n.units||!n.reservations)throw new Error('Invalid backup');db=n;ensure();save();initProperty();go('dashboard');alert('Backup restored successfully.')}catch(e){alert('Cannot restore this backup: '+e.message)}};rd.readAsText(f);
}
function operationalHealth(){
 const active=db.reservations.filter(r=>!['CANCELLED','NO_SHOW'].includes(r.status));
 let conflicts=0;
 for(let i=0;i<active.length;i++)for(let j=i+1;j<active.length;j++)if(active[i].unitId===active[j].unitId&&active[i].checkIn<active[j].checkOut&&active[j].checkIn<active[i].checkOut)conflicts++;
 return {conflicts,units:db.units.length,bookings:active.length};
}


function addGuest(){
 modal(`<h2>New guest</h2><div class="form"><label>Name<input id="gname"></label><label>Email<input id="gemail" type="email"></label><label>Phone<input id="gphone"></label><label>Country<input id="gcountry" value="CZ"></label></div><div class="toolbar"><button class="btn primary" onclick="saveGuest()">Save guest</button><button class="btn" onclick="closeModal()">Close</button></div>`)
}
function saveGuest(){let name=$('gname').value.trim();if(!name){alert('Guest name is required.');return}db.guests.push({id:uid(),name,email:$('gemail').value.trim(),phone:$('gphone').value.trim(),country:$('gcountry').value.trim().toUpperCase()});save();audit('GUEST_CREATED',name);closeModal();go('guests')}
function addMaintenance(){
 modal(`<h2>New maintenance issue</h2><div class="form"><label>Unit<select id="munit">${unitOpts('')}</select></label><label>Priority<select id="mpriority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select></label><label class="full">Issue<input id="missue"></label></div><div class="toolbar"><button class="btn primary" onclick="saveMaintenance()">Create issue</button><button class="btn" onclick="closeModal()">Close</button></div>`)
}
function saveMaintenance(){let issue=$('missue').value.trim();if(!issue){alert('Describe the issue.');return}db.maintenance.push({id:uid(),unitId:$('munit').value,issue,status:'OPEN',priority:$('mpriority').value});save();audit('MAINTENANCE_CREATED',issue);closeModal();go('maintenance')}
function closeMaintenance(id){let m=db.maintenance.find(x=>x.id===id);if(m){m.status='CLOSED';save();audit('MAINTENANCE_CLOSED',m.issue);go('maintenance')}}
function addPayment(){
 let invs=db.invoices.filter(i=>i.status!=='PAID');
 modal(`<h2>Record payment</h2><div class="form"><label>Invoice<select id="pinv">${invs.map(i=>`<option value="${i.id}">${i.number} · ${money(i.total)}</option>`).join('')}</select></label><label>Amount<input id="pamt" type="number" step="0.01"></label><label>Method<select id="pmethod"><option>CARD</option><option>BANK_TRANSFER</option><option>CASH</option></select></label></div><div class="toolbar"><button class="btn primary" onclick="savePayment()">Save payment</button><button class="btn" onclick="closeModal()">Close</button></div>`)
}
function savePayment(){let iid=$('pinv').value,amt=+$('pamt').value;if(!iid||!(amt>0)){alert('Choose invoice and enter amount.');return}db.payments.push({id:uid(),invoiceId:iid,amount:amt,status:'SUCCEEDED',method:$('pmethod').value,date:ymd(new Date())});let inv=db.invoices.find(i=>i.id===iid);let paid=db.payments.filter(p=>p.invoiceId===iid&&p.status==='SUCCEEDED').reduce((a,p)=>a+(+p.amount||0),0);if(inv&&paid>=inv.total)inv.status='PAID';save();audit('PAYMENT_RECORDED',money(amt));closeModal();go('payments')}
function issueInvoice(id){let i=db.invoices.find(x=>x.id===id);if(i){i.status='ISSUED';save();audit('INVOICE_ISSUED',i.number);go('folio')}}
function addCompliance(){
 modal(`<h2>Czech guest registration</h2><div class="form"><label>Guest<select id="cguest">${db.guests.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select></label><label>Reservation<select id="cres">${db.reservations.map(r=>`<option value="${r.id}">${r.code}</option>`).join('')}</select></label><label>Date of birth<input id="cdob" type="date"></label><label>Document / passport<input id="cdoc"></label><label>Nationality<input id="cnat"></label><label>Tourist tax / night<input id="ctax" type="number" step="0.01" value="50"></label></div><div class="toolbar"><button class="btn primary" onclick="saveCompliance()">Save record</button><button class="btn" onclick="closeModal()">Close</button></div>`)
}
function saveCompliance(){let rid=$('cres').value,r=db.reservations.find(x=>x.id===rid);if(!r)return;let nights=Math.max(1,Math.round((new Date(r.checkOut+'T00:00:00')-new Date(r.checkIn+'T00:00:00'))/86400000)),rate=+$('ctax').value||0;let rec={id:uid(),guestId:$('cguest').value,reservationId:rid,dob:$('cdob').value,document:$('cdoc').value.trim(),nationality:$('cnat').value.trim(),nights,taxRate:rate,taxTotal:nights*rate,status:'READY_FOR_EXPORT'};db.guestRegister.push(rec);save();audit('CZ_GUEST_REGISTER',r.code);closeModal();go('compliance')}
function downloadComplianceCSV(){
 let rows=[['Reservation','Guest','Check-in','Check-out','DOB','Document','Nationality','Nights','Tax rate','Tax total']];
 db.guestRegister.forEach(x=>{let r=db.reservations.find(z=>z.id===x.reservationId),g=guest(x.guestId);rows.push([r?.code||'',g?.name||'',r?.checkIn||'',r?.checkOut||'',x.dob||'',x.document||'',x.nationality||'',x.nights||0,x.taxRate||0,x.taxTotal||0])});
 let csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');let b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='staynora-cz-guest-register-'+ymd(new Date())+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);audit('CZ_EXPORT','Guest register CSV exported')
}
function addUnit(){
 modal(`<h2>New unit</h2><div class="form"><label>Property<select id="uprop">${db.properties.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></label><label>Name<input id="uname"></label><label>Code<input id="ucode"></label><label>Max guests<input id="uguests" type="number" value="2"></label></div><div class="toolbar"><button class="btn primary" onclick="saveUnit()">Save unit</button><button class="btn" onclick="closeModal()">Close</button></div>`)
}
function saveUnit(){let n=$('uname').value.trim();if(!n){alert('Unit name is required.');return}db.units.push({id:uid(),propertyId:$('uprop').value,name:n,code:$('ucode').value.trim()||('UNIT-'+(db.units.length+1)),guests:+$('uguests').value||2,status:'READY'});save();audit('UNIT_CREATED',n);closeModal();go('properties')}

const pages={
dashboard:()=>{let h=operationalHealth();return page('Dashboard','Live operational overview')+`<div class="${h.conflicts?'notice':''}" style="margin-top:10px">${h.conflicts?'<b>Attention:</b> '+h.conflicts+' booking conflict(s) detected.':'✓ Inventory conflict check passed.'}</div><div class="grid"><div class="card"><div class="muted">Occupancy</div><div class="kpi">${occupancy()}%</div></div><div class="card"><div class="muted">Gross revenue</div><div class="kpi">${money(revenue())}</div></div><div class="card"><div class="muted">Units</div><div class="kpi">${filteredUnits().length}</div></div><div class="card"><div class="muted">Bookings</div><div class="kpi">${filteredReservations().length}</div></div></div><div class="toolbar"><button class="btn primary" onclick="newReservation()">＋ New booking</button><button class="btn" onclick="go('calendar')">Open calendar</button></div><div class="card">${resTable(filteredReservations().slice(0,6))}</div>`},
calendar,
reservations:()=>page('Reservations','Lifecycle, dates, unit and status')+`<div class="toolbar"><button class="btn primary" onclick="newReservation()">＋ Reservation</button></div><div class="card">${resTable(filteredReservations())}</div>`,
guests:()=>page('Guests','Guest CRM')+`<div class="toolbar"><button class="btn primary" onclick="addGuest()">＋ New guest</button></div><div class="card"><table class="table"><tr><th>Name</th><th>Email</th><th>Phone</th><th>Country</th></tr>${db.guests.map(g=>`<tr><td>${g.name}</td><td>${g.email}</td><td>${g.phone}</td><td>${g.country}</td></tr>`).join('')}</table></div>`,
housekeeping:()=>page('Housekeeping','Room readiness')+`<div class="card"><table class="table"><tr><th>Date</th><th>Unit</th><th>Task</th><th>Status</th><th></th></tr>${db.tasks.map(t=>`<tr><td>${t.date}</td><td>${unit(t.unitId)?.name||''}</td><td>${t.type}</td><td>${status(t.status)}</td><td>${t.status!=='COMPLETED'?`<button class="btn" onclick="completeTask('${t.id}')">Complete</button>`:''}</td></tr>`).join('')}</table></div>`,
maintenance:()=>page('Maintenance','Open issues')+`<div class="toolbar"><button class="btn primary" onclick="addMaintenance()">＋ New issue</button></div><div class="card"><table class="table"><tr><th>Unit</th><th>Issue</th><th>Priority</th><th>Status</th><th></th></tr>${db.maintenance.map(m=>`<tr><td>${unit(m.unitId)?.name||''}</td><td>${m.issue}</td><td>${m.priority}</td><td>${status(m.status)}</td><td>${m.status!=='CLOSED'?`<button class="btn" onclick="closeMaintenance('${m.id}')">Close</button>`:''}</td></tr>`).join('')}</table></div>`,
properties:()=>page('Properties & Units','Multi-property inventory')+`<div class="toolbar"><button class="btn primary" onclick="addUnit()">＋ New unit</button></div>`+db.properties.map(p=>`<div class="card" style="margin-top:12px"><h3>${p.name}</h3><div class="muted">${p.city}, ${p.country}</div>${db.units.filter(u=>u.propertyId===p.id).map(u=>`<p><b>${u.name}</b> · ${u.code} · max ${u.guests} guests · ${status(u.status)}</p>`).join('')}</div>`).join(''),
availability:()=>page('Availability','Conflict-aware inventory')+`<div class="card">${filteredUnits().map(u=>`<p><b>${u.name}</b> · ${status(u.status)}</p>`).join('')}</div>`,
rates:()=>page('Rates & Restrictions','Base pricing and weekend uplift')+`<div class="card"><div class="form"><label>Default nightly rate<input id="br" type="number" value="${db.settings.defaultRate}"></label><label>Weekend uplift %<input id="wu" type="number" value="${db.settings.weekendUplift}"></label><label>Cleaning fee<input id="cf" type="number" value="${db.settings.cleaningFee}"></label><div><button class="btn primary" onclick="saveRates()">Save</button></div></div></div>`,
booking:()=>page('Booking Engine','Direct booking workflow')+`<div class="card"><p>Use <b>＋ New booking</b> to create a direct reservation with live conflict checking.</p><button class="btn primary" onclick="newReservation()">＋ New booking</button></div>`,
folio:()=>page('Invoices & Folio','Invoice lifecycle')+`<div class="card"><table class="table"><tr><th>Invoice</th><th>Reservation</th><th>Total</th><th>Status</th><th></th></tr>${db.invoices.map(i=>`<tr><td>${i.number}</td><td>${db.reservations.find(r=>r.id===i.reservationId)?.code||''}</td><td>${money(i.total)}</td><td>${status(i.status)}</td><td>${i.status==='DRAFT'?`<button class="btn" onclick="issueInvoice('${i.id}')">Issue</button>`:''}</td></tr>`).join('')}</table></div>`,
payments:()=>page('Payments & Refunds','Manual payment ledger')+`<div class="toolbar"><button class="btn primary" onclick="addPayment()">＋ Record payment</button></div><div class="card"><table class="table"><tr><th>Invoice</th><th>Method</th><th>Amount</th><th>Status</th></tr>${db.payments.map(p=>`<tr><td>${db.invoices.find(i=>i.id===p.invoiceId)?.number||''}</td><td>${p.method}</td><td>${money(p.amount)}</td><td>${status(p.status)}</td></tr>`).join('')}</table></div>`,
finance:()=>page('Finance','Revenue overview')+`<div class="grid"><div class="card"><div class="muted">Gross</div><div class="kpi">${money(revenue())}</div></div><div class="card"><div class="muted">Reservations</div><div class="kpi">${filteredReservations().length}</div></div></div>`,
channels:()=>page('Channel Sync Center','Booking.com / Airbnb integration workspace')+`<div class="notice"><b>API connection required.</b> This local edition will not pretend to sync OTA data. Production connection requires approved Booking.com/Airbnb credentials and a secure backend.</div><div class="grid"><div class="card"><b>Booking.com</b><p class="muted">Status: Not connected</p><span class="pill warn">Credentials required</span></div><div class="card"><b>Airbnb</b><p class="muted">Status: Not connected</p><span class="pill warn">Partner/API access required</span></div></div>`,
portal:()=>page('Guest Portal','Guest-facing stay workspace')+`<div class="card">Guest portal demo module.</div>`,
compliance:()=>page('Czech Guest Register & Tourist Tax','Operational register for Czech accommodation')+`<div class="toolbar"><button class="btn primary" onclick="addCompliance()">＋ Add guest record</button><button class="btn" onclick="downloadComplianceCSV()">Export CSV</button></div><div class="notice">Prepared for operational record keeping and export. Direct UbyPort submission requires official integration credentials/backend.</div><div class="card" style="margin-top:12px"><table class="table"><tr><th>Reservation</th><th>Guest</th><th>Nationality</th><th>Nights</th><th>Tax</th><th>Status</th></tr>${db.guestRegister.map(x=>`<tr><td>${db.reservations.find(r=>r.id===x.reservationId)?.code||''}</td><td>${guest(x.guestId)?.name||''}</td><td>${x.nationality||''}</td><td>${x.nights||0}</td><td>${money(x.taxTotal||0)}</td><td>${status(x.status)}</td></tr>`).join('')}</table></div>`,
reports:()=>page('Reports','Operational KPIs')+`<div class="grid"><div class="card"><div class="muted">Occupancy</div><div class="kpi">${occupancy()}%</div></div><div class="card"><div class="muted">Revenue</div><div class="kpi">${money(revenue())}</div></div></div>`,
audit:()=>{let a=[];try{a=JSON.parse(localStorage.getItem(AUD)||'[]')}catch(e){}return page('Audit Log','Local browser audit trail')+`<div class="card">${a.length?a.map(x=>`<p><b>${x.action}</b> · ${x.detail}<br><span class="muted">${new Date(x.time).toLocaleString()}</span></p>`).join(''):'No events yet.'}</div>`},
settings:()=>page('Settings','Data, defaults and backup')+`<div class="card"><p>Currency: <b>${db.settings.currency||'EUR'}</b></p><p>Storage: <b>this browser / localStorage</b></p><div class="toolbar"><button class="btn" onclick="exportBackup()">Export backup</button><label class="btn" style="cursor:pointer">Import backup<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></label></div><div class="notice">Export a backup before clearing Safari data or moving to another device.</div></div>`,
more:()=>page('Staynora Modules','All modules')+`<div class="grid">${navGroups.flatMap(g=>g[1]).filter(x=>x[0]!=='dashboard').map(x=>`<button class="card" onclick="go('${x[0]}')" style="text-align:left;min-height:70px"><b>${x[1]}</b></button>`).join('')}</div>`
};
function completeTask(id){let t=db.tasks.find(x=>x.id===id);t.status='COMPLETED';if(unit(t.unitId))unit(t.unitId).status='READY';save();go('housekeeping')}
function saveRates(){db.settings.defaultRate=+$('br').value;db.settings.weekendUplift=+$('wu').value;db.settings.cleaningFee=+$('cf').value;save();go('rates')}
function resetDemo(){if(confirm('Reset Staynora demo data?')){db=JSON.parse(JSON.stringify(seed));save();localStorage.removeItem(AUD);initProperty();go('dashboard')}}
initProperty();renderNav();go('dashboard');
</script></body></html>
